server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /game-engine {
        return 301 /game-engine/;
    }

    location /game-engine/ {
        rewrite ^/game-engine/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
