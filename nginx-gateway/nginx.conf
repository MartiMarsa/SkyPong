events {}

http
{
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  map $http_upgrade $connection_upgrade
  {
  default upgrade;
  '' close;
  }


  server
  {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Frontend estático (React build)
    root /usr/share/nginx/html;
    index index.html;

    location /
    {
      try_files $uri /index.html;
    }

    # Auth API
    location /api/auth/
    {
      proxy_pass http://auth-service:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Game API - only for prometheus testing
    location /api/game/
    {
      proxy_pass http://game-service:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Profile API
    location /api/profile/
    {
      proxy_pass http://profile-service:5000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statistics API
    location /api/statistics/
    {
      proxy_pass http://statistics-service:6000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → game-service (WSS)
    location ^~ /ws/
    {
      proxy_pass http://game-service:4000/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }

  # Endpoint interno para métricas de Nginx (solo red Docker)
  server
  {
    listen 8080;

    location /nginx_status
    {
      stub_status;
      access_log off;
    }
  }
}
