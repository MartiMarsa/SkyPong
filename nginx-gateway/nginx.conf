events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ────────────────────────────────────────
    # UPSTREAMS - Define los backend services
    # ────────────────────────────────────────
    upstream auth_backend {
        server auth-service:8081;
    }

    upstream game_backend {
        server game-service:4000;
    }

    upstream profile_backend {
        server profile-service:5000;
    }

    upstream statistics_backend {
        server statistics-service:6000;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    # ────────────────────────────────────────
    # SERVIDOR PRINCIPAL (HTTPS)
    # ────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # ────────────────────────────────────────
        # API ROUTES (deben ir ANTES del location /)
        # ────────────────────────────────────────
        
        # Auth API
        location /api/auth/ {
            proxy_pass http://auth_backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header 'Access-Control-Allow-Origin' 'https://localhost:8443' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') { return 204; }
        }


        # Game API
        location /api/game/ {
            proxy_pass http://game_backend/api/game/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Profile API
        location /api/profile/ {
#			rewrite ^/api/profile/(.*)$ /$1 break;
            proxy_pass http://profile_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

			add_header 'Access-Control-Allow-Origin' 'https://localhost:8443' always;
			add_header 'Access-Control-Allow-Credentials' 'true' always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
			add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

			if ($request_method = 'OPTIONS') { return 204; }
        }

#		location /me {
#			proxy_pass http://profile-service:5000/me;
#		}


        # Statistics API
        location /api/statistics/ {
            proxy_pass http://statistics_backend/api/statistics/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket para Game Service
        location /ws/ {
            proxy_pass http://game_backend/ws/;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # ────────────────────────────────────────
        # FRONTEND - Next.js App (debe ir AL FINAL)
        # ────────────────────────────────────────
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ────────────────────────────────────────
    # SERVIDOR PARA MÉTRICAS (puerto 8080)
    # ────────────────────────────────────────
    server {
        listen 8080;

        location /nginx_status {
            stub_status;
            access_log off;
            
            # Solo permite acceso desde redes internas
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Redes Docker
            deny all;
        }
    }

    # ────────────────────────────────────────
    # OPCIONAL: Redirección HTTP -> HTTPS
    # ────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }
}
