global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 3s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:3000"]

  - job_name: game-service
    static_configs:
      - targets: ["game-service:4000"]

  - job_name: profile-service
    static_configs:
      - targets: ["profile-service:5000"]

  - job_name: statistics-service
    static_configs:
      - targets: ["statistics-service:6000"]
