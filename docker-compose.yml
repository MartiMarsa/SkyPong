
# ──────────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────────
networks:
  backend:     # NGINX → Microservicios
    driver: bridge
  internal:    # Infra invisible (Prometheus, Grafana, exporters)
    driver: bridge

# ──────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────
volumes:
  sqlite_auth:
  prometheus_data:
  grafana_data:
  certs:
  frontend_static:

# ──────────────────────────────────────────────
# SERVICES — EDGE LAYER
# ──────────────────────────────────────────────

nginx-gateway:
  container_name: nginx-gateway
  build: ./nginx-gateway
  ports:
    - "443:443"
  depends_on:
    - frontend
    - auth-service
    - game-service
  networks:
    - backend
  volumes:
    - ./nginx-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    - certs:/etc/nginx/certs

# ──────────────────────────────────────────────
# FRONTEND SPA
# ──────────────────────────────────────────────

frontend:
  container_name: frontend
  build: ./frontend
  volumes:
    - frontend_static:/usr/share/nginx/html
  # No se expone puerto: solo accesible vía NGINX

# ──────────────────────────────────────────────
# MICROSERVICIOS
# ──────────────────────────────────────────────

auth-service:
  container_name: auth-service
  build: ./auth-service
  networks:
    - backend
    - internal
  volumes:
    - sqlite_auth:/app/data
  environment:
    - SERVICE_NAME=auth-service
    - NODE_ENV=production

game-service:
  container_name: game-service
  build: ./game-service
  networks:
    - backend
    - internal
  environment:
    - SERVICE_NAME=game-service
    - NODE_ENV=production

# ──────────────────────────────────────────────
# MONITORING — PROMETHEUS + EXPORTERS + GRAFANA
# ──────────────────────────────────────────────

nginx-exporter:
  container_name: nginx-exporter
  image: nginx/nginx-prometheus-exporter
  command:
    - -nginx.scrape-uri=http://nginx-gateway:8080/nginx_status
  depends_on:
    - nginx-gateway
  networks:
    - internal
    - backend

prometheus:
  container_name: prometheus
  image: prom/prometheus
  networks:
    - internal
  volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
  command:
    - "--config.file=/etc/prometheus/prometheus.yml"

grafana:
  container_name: grafana
  image: grafana/grafana
  networks:
    - internal
  volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}

